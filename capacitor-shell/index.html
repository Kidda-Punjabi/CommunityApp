<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kidda</title>
    <style>
      :root {
        color-scheme: light;
        background: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #18181b;
      }
      main {
        max-width: 320px;
        text-align: center;
      }
      img {
        width: 120px;
        height: 120px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        font-weight: 650;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        color: #52525b;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #7c3aed;
        color: white;
        font-size: 16px;
        font-weight: 650;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="peacock.png" alt="Kidda" />
      <p>You're offline. Check your connection and try again.</p>
      <button type="button" onclick="location.replace('https://webapp.kidda.app')">Retry</button>
    </main>
  </body>
</html>
