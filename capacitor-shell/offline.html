<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kidda</title>
    <style>
      :root {
        color-scheme: light;
        background: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #18181b;
      }
      main {
        max-width: 320px;
        text-align: center;
      }
      img {
        width: 120px;
        height: 120px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        font-weight: 650;
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        color: #52525b;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #7c3aed;
        color: white;
        font-size: 16px;
        font-weight: 650;
        padding: 12px 22px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main id="connecting">
      <img src="peacock.png" alt="Kidda" />
      <h1>Connecting…</h1>
    </main>
    <main id="offline" hidden>
      <img src="peacock.png" alt="Kidda" />
      <h1>No internet connection</h1>
      <p>Kidda will open again as soon as you're back online.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      var target = "https://webapp.kidda.app/";
      var started = Date.now();
      var trying = false;
      var revealed = false;
      var GRACE_MS = 15000;
      function showOffline() {
        if (revealed) return;
        revealed = true;
        document.getElementById("connecting").hidden = true;
        document.getElementById("offline").hidden = false;
      }
      function maybeGiveUp() {
        if (navigator.onLine === false || Date.now() - started >= GRACE_MS) showOffline();
      }
      function retry() {
        maybeGiveUp();
        if (trying) return;
        trying = true;
        fetch(target, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            window.location.replace(target);
          })
          .catch(function () {
            trying = false;
            maybeGiveUp();
          });
      }
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      retry();
      var fastTimer = window.setInterval(function () {
        if (Date.now() - started >= GRACE_MS) {
          window.clearInterval(fastTimer);
          showOffline();
          window.setInterval(retry, 4000);
          return;
        }
        retry();
      }, 1500);
      // The launch splash stays up until the remote app hides it. This page is
      // what loads when that app cannot be reached, so hide the splash here.
      var splashTries = 0;
      var splashTimer = window.setInterval(function () {
        splashTries += 1;
        var plugins = window.Capacitor && window.Capacitor.Plugins;
        if (plugins && plugins.SplashScreen) {
          plugins.SplashScreen.hide({ fadeOutDuration: 200 });
          window.clearInterval(splashTimer);
        } else if (splashTries > 25) {
          window.clearInterval(splashTimer);
        }
      }, 100);
    </script>
  </body>
</html>
