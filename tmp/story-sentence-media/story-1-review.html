<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Story 1 test batch — The Lion and the Mouse</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
    body { margin: 0; background: #f6f1e8; color: #1c1917; }
    header { padding: 1.5rem 1.25rem 0.5rem; max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 0.35rem; }
    .meta { color: #57534e; font-size: 0.95rem; line-height: 1.45; }
    .card {
      max-width: 720px; margin: 1rem auto; background: #fff;
      border: 1px solid #e7e5e4; border-radius: 18px; padding: 1rem 1.1rem 1.15rem;
      box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
    }
    .order { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: #a8a29e; font-weight: 700; font-family: system-ui, sans-serif; }
    .en { margin: 0.35rem 0 0; color: #44403c; }
    .pa { margin: 0.45rem 0 0; font-size: 1.35rem; line-height: 1.45; }
    .rom { margin: 0.25rem 0 0; color: #7c3aed; font-family: system-ui, sans-serif; font-size: 0.95rem; }
    img.scene { width: 100%; border-radius: 14px; margin-top: 0.75rem; background: #f5f5f4; min-height: 160px; object-fit: cover; }
    .missing { margin-top: 0.75rem; padding: 0.75rem; border-radius: 12px; background: #fff7ed; color: #9a3412; font-family: system-ui, sans-serif; font-size: 0.9rem; }
    audio { width: 100%; margin-top: 0.75rem; }
    footer { max-width: 720px; margin: 1.5rem auto 3rem; padding: 0 1.25rem; color: #78716c; font-size: 0.9rem; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <header>
    <h1>The Lion and the Mouse — Story 1 test</h1>
    <p class="meta">
      Review image consistency + Yatin audio quality before approving the remaining 29 stories.<br />
      Full-story audio is unchanged. These are new per-sentence clips.
    </p>
  </header>
  <div id="root">Loading report…</div>
  <footer id="cost"></footer>
  <script>
    async function main() {
      const res = await fetch("./story-1-report.json");
      const data = await res.json();
      const root = document.getElementById("root");
      root.innerHTML = data.items.map((item) => {
        const img = item.image_url
          ? `<img class="scene" src="${item.image_url}" alt="Scene ${item.sentence_order}" />`
          : `<div class="missing">Image not generated yet${item.image_error ? `: ${item.image_error}` : ""}</div>`;
        const audio = item.audio_url
          ? `<audio controls preload="metadata" src="${item.audio_url}"></audio>`
          : `<div class="missing">Audio missing</div>`;
        return `<article class="card">
          <div class="order">Sentence ${item.sentence_order}</div>
          <p class="pa">${item.gurmukhi ?? ""}</p>
          <p class="en">${item.english ?? ""}</p>
          ${img}
          ${audio}
        </article>`;
      }).join("");
      const c = data.estimatedCostUsd || {};
      document.getElementById("cost").textContent =
        `Estimated test spend — Gemini images: $${c.geminiImages ?? 0} · ElevenLabs audio: $${c.elevenLabsAudio ?? 0} · Total: $${c.total ?? 0}`;
    }
    main().catch((e) => { document.getElementById("root").textContent = String(e); });
  </script>
</body>
</html>
